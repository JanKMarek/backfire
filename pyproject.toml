[project]
name = "backfire"
version = "0.1.0"
description = "Backtesting framework for entry/exit signal driven stock trading strategies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=3.0",
    "pandas-datareader>=0.10",
    "lxml>=5.4",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "matplotlib>=3.10",
    "plotly>=6.0",
    "dash>=3.0",
    "nbformat>=5.10",
    "beautifulsoup4>=4.13",
]

[tool.uv]
# This machine sits behind a TLS-inspecting proxy; use the Windows cert store.
system-certs = true
# uv's cache is on C: while this project is on D:, so hardlinking is unavailable.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backfire"]
