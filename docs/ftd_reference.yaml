# Reference and candidate Follow Through Days.
#
# This file is the primary source of the dates of IBD Follow Through Day calls:
# test/integration/test_ftd_qqq.py checks the signal against it and backfire/ftd_signal_verification_report.py
# builds the reference gallery from it. docs/SIGNALS.md, 'Signal verification', points here.
#
# Every entry has:
#   date        the Follow Through Day itself
#   episode     what the market was coming out of
#   day1        Day 1 of the rally attempt the FTD confirmed, null when not recorded
#   kind        'reference' - an IBD style discretionary call on the Nasdaq Composite, used as
#               a sanity check; or 'candidate' - a date recalled but not yet confirmed against
#               IBD's archive, so not an expectation until it has been
#   confidence   for a candidate: 'medium' (fairly sure of the date), 'low' (an FTD happened
#               around then but the date may be off) or 'contradicted' (the recalled date
#               fails a plausibility check on QQQ, so the real FTD is a nearby day). Null for
#               a reference, which is not graded.
#   notes       the context, and for a candidate the QQQ close to close gain on the date and
#               whether QQQ volume rose
#
# A reference the mechanical rules cannot reach with the default parameters also carries:
#   unreachable.reason            why, in words
#   unreachable.low               the day the correction precondition is applied to and fails
#   unreachable.block             the clause it fails, as the signal's 'day0_block' records it
#   unreachable.detected_instead  the Follow Through Day the rules confirm the bottom on
#
# Oct 15, 1998 (the surprise Fed cut after the Oct 8 LTCM low) is an episode where an FTD
# almost certainly happened. It has no confirmed date and predates the QQQ data, so it is
# listed in docs/turnaround_points.csv rather than here.

