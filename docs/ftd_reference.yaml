  - date: 2003-03-17
    episode: Dot-com crash 3
    day1: 2003-03-12
    kind: reference
    confidence: null
    notes: Day 4 off the Mar 12 low.
    unreachable:
      reason: >-
        the rules confirm this bottom on 2003-02-18 and stay in UPTREND from there: QQQ never
        closes below that rally low and keeps making higher highs, so the correction test
        never holds again
      low: 2003-03-12
      block: DECLINE
      detected_instead: 2003-02-18

  - date: 2009-03-12
    episode: GFC
    day1: 2009-03-09
    kind: reference
    confidence: null
    notes: Day 3 off of Mar 9 low. IBD made an exception to the Day 4 rule.
    unreachable:
      reason: >-
        still UPTREND from the 2008-12-02 Follow Through Day: QQQ never closes below its rally
        low of 22.09 (the 2009-03-09 low closed at 22.73) and the high since it, made on
        2009-02-10, is only 18 trading days before that low - short of min_peak_age_days
      low: 2009-03-09
      block: PEAK_AGE
      detected_instead: 2008-12-02

  - date: 2010-09-01
