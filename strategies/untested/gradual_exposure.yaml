strategy:
  name: gradual_exposure
  entry_signal:
    name: ShortMAAboveLongMA
    short_MA: 50 # days
    long_MA: 200 # days
  exit_signal:
    name: OrSignal
    signals:
      - name: ShortMABelowLongMA
        short_MA: 50 # days
        long_MA: 200 # days
      - name: TakeProfitSignal
        threshold: 0.25
  risk_management:
    name: BasicRiskManagement
    stop_loss: 0.07
  position_management:
    name: GradualExposure
    initial_position: 100000
    schedule: {0: 0.1, 0.03: 0.05, 0.05: 0.05}
